x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
    target: dev
  working_dir: /app
  restart: unless-stopped
  env_file:
    - .env
  environment: &app-env
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nti_db?schema=public
    REDIS_HOST: redis
    RUN_QUEUE_PROCESSORS: 'true'
    PUPPETEER_SKIP_DOWNLOAD: 'true'
    PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    CHOKIDAR_USEPOLLING: 'true'
    CHOKIDAR_INTERVAL: '1000'
    WATCHPACK_POLLING: 'true'
    TSC_WATCHFILE: UsePolling
  volumes:
    - .:/app
    # Keep the image's node_modules / generated client instead of the host's.
    - /app/node_modules
    - /app/generated
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app-base
    # Regenerate the client on every boot so the anonymous /app/generated
    # volume always matches the current schema; a stale client otherwise
    # survives across rebuilds and breaks compilation on schema changes.
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run start:dev"
    ports:
      - '3001:3001'
    healthcheck:
      test:
        ['CMD', 'node', '-e', "require('http').get('http://localhost:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Optional dedicated worker. The `app` service already runs the queue
  # processors in-process (as in prod), so this is off by default.
  # Start it only when you want to test a dedicated worker:
  #   docker compose --profile worker up
  worker:
    <<: *app-base
    profiles: ['worker']
    command: sh -c "npx prisma generate && npm run start:worker:dev"

  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nti_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
